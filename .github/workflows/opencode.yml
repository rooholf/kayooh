# OpenCode GitHub automation — main trigger.
#
# Mention /oc or /opencode in any issue or PR comment and OpenCode runs on the
# repo with the persona from AGENTS.md matching the issue's label. The prompt
# routes to the right project agent (architect, backend, web-frontend,
# pwa-engineer, qa, tpm, ui-ux) via the label → agent map below.
#
# Model failover: the primary run uses reflection/Beam-1.0-501B-A23B. If that
# run fails (503s, provider outage, ...), an Agnes fallback job retries the same
# task on agnes/agnes-3.0-flash instead of letting the run fail outright.
#
# Requires: secret REFLECTION_API_KEY (https://api.reflection.ai — primary).
# Requires: secret AGNES_API_KEY (https://apihub.agnes-ai.com — fallback).
# Requires: secret OPENCODE_GITHUB_TOKEN (PAT with repo scope). This workflow
# uses use_github_token mode (no OpenCode GitHub App needed): the PAT powers
# API calls, branch pushes and PRs, so it needs contents/issues/PR write.
#
# Branching (AGENTS.md §8): all runs branch from and PR into `staging`.
# `main` is promotion-only and must never be used as a PR base by any agent.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    # Cap a hung run (e.g. an unanswered permission prompt, or a stalled
    # stream) so it can't burn a ~90-min runner. A healthy agent session on
    # these tasks finishes well within 60 min; anything beyond is a hang.
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 1
          # default persist-credentials: true — the checkout token stays in
          # .git/config so OpenCode can push the implementation branch.

      - name: Configure git identity
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Branching rules for this run (AGENTS.md §8)
        run: |
          {
            echo "## Branching rules"
            echo "- Work on `staging`. Create your branch from the current `staging` HEAD."
            echo "- Open your PR with **base `staging`** — never `main`."
            echo "- Never push to or open a PR against `main` (promotion-only branch)."
            echo "- If a review happens on a PR that targets `main`, open the fix"
            echo "  as a new branch from `staging` with base `staging` instead."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve persona from issue label
        id: persona
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          agent="general"
          if echo "$LABELS" | grep -q 'Lead Platform Architect'; then agent=architect
          elif echo "$LABELS" | grep -q 'Backend Specialist'; then agent=backend
          elif echo "$LABELS" | grep -q 'Web Frontend Developer'; then agent=web-frontend
          elif echo "$LABELS" | grep -q 'Offline PWA Engineer'; then agent=pwa-engineer
          elif echo "$LABELS" | grep -q 'Quality Assurance & SDET'; then agent=qa
          elif echo "$LABELS" | grep -q 'Technical Project Manager'; then agent=tpm
          elif echo "$LABELS" | grep -q 'UI/UX Designer'; then agent=ui-ux
          fi
          case "$agent" in
            architect|backend|qa) variant=max ;;
            web-frontend|pwa-engineer|ui-ux) variant=high ;;
            tpm) variant=high ;;
            *) variant=medium ;;
          esac
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "Resolved persona agent: $agent (variant: $variant)"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          REFLECTION_API_KEY: ${{ secrets.REFLECTION_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
        with:
          model: reflection/Beam-1.0-501B-A23B
          agent: ${{ steps.persona.outputs.agent }}
          variant: ${{ steps.persona.outputs.variant }}
          use_github_token: true
          prompt: |
            Fix the issue from this GitHub event. Create a new branch from the current HEAD of `staging` and open a pull request when the work is complete.

            CRITICAL — AGENTS.md §8 (promotion-only `main`):
            When you create the pull request you MUST run exactly:
              gh pr create --base staging --head <your-branch-name>
            Never omit `--base staging`: `gh pr create` defaults to the repository's default branch (`main`), which is promotion-only. A PR opened against `main` from a non-`staging` branch fails the `enforce-pr-base` status check and cannot be merged.
            Never push to or open a PR against `main` directly.

  opencode-fallback:
    # An if: with no status-check function gets success() auto-prepended by
    # GitHub, so a bare `.result == 'failure'` check is ALWAYS false when the
    # primary failed — that is why the fallback never fired. Prefixing
    # !cancelled() (a status-check function) opts the job in. The .result
    # clause then selects the outcomes we care about: failure, or cancelled
    # (GitHub cancels the primary when a run is re-triggered / new commit
    # lands). A fully cancelled run stays skipped (!cancelled() = false).
    if: ${{ !cancelled() && (needs.opencode.result == 'failure' || needs.opencode.result == 'cancelled') }}
    needs: opencode
    # No job-level concurrency group here: a queued fallback job gets CANCELLED
    # when its own run completes while it waits on another run's slot, so a
    # cross-run queue silently loses the fallback. Fallbacks therefore start
    # concurrently (a parallel /oc batch can run N Agnes sessions at once —
    # acceptable for a paid key) rather than being "serialized".
    runs-on: ubuntu-latest
    # Same hang-cap as the primary job: a stalled permission prompt or stream
    # must not burn a 90-min runner. 60 min is plenty for a real session.
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Announce fallback
        run: |
          echo "## Fallback run" >> "$GITHUB_STEP_SUMMARY"
          echo "The primary run (reflection/Beam-1.0-501B-A23B) failed. Retrying the" >> "$GITHUB_STEP_SUMMARY"
          echo "same task on the Agnes fallback model (agnes/agnes-3.0-flash)." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Branching rules for this run (AGENTS.md §8)
        run: |
          {
            echo "## Branching rules (fallback run)"
            echo "- Work on `staging`. Create your branch from the current `staging` HEAD."
            echo "- Open your PR with **base `staging`** — never `main`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve persona from issue label
        id: persona
        env:
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          agent="general"
          if echo "$LABELS" | grep -q 'Lead Platform Architect'; then agent=architect
          elif echo "$LABELS" | grep -q 'Backend Specialist'; then agent=backend
          elif echo "$LABELS" | grep -q 'Web Frontend Developer'; then agent=web-frontend
          elif echo "$LABELS" | grep -q 'Offline PWA Engineer'; then agent=pwa-engineer
          elif echo "$LABELS" | grep -q 'Quality Assurance & SDET'; then agent=qa
          elif echo "$LABELS" | grep -q 'Technical Project Manager'; then agent=tpm
          elif echo "$LABELS" | grep -q 'UI/UX Designer'; then agent=ui-ux
          fi
          case "$agent" in
            architect|backend|qa) variant=max ;;
            web-frontend|pwa-engineer|ui-ux) variant=high ;;
            tpm) variant=high ;;
            *) variant=medium ;;
          esac
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "Resolved persona agent: $agent (variant: $variant)"

      - name: Run OpenCode (Agnes fallback)
        uses: anomalyco/opencode/github@latest
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
        with:
          model: agnes/agnes-3.0-flash
          agent: ${{ steps.persona.outputs.agent }}
          use_github_token: true
          prompt: |
            Fix the issue from this GitHub event. Create a new branch from the current HEAD of `staging` and open a pull request when the work is complete.

            CRITICAL — AGENTS.md §8 (promotion-only `main`):
            When you create the pull request you MUST run exactly:
              gh pr create --base staging --head <your-branch-name>
            Never omit `--base staging`: `gh pr create` defaults to the repository's default branch (`main`), which is promotion-only. A PR opened against `main` from a non-`staging` branch fails the `enforce-pr-base` status check and cannot be merged.
            Never push to or open a PR against `main` directly.
