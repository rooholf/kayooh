# Promote `staging` to `main` (AGENTS.md §8: main is promotion-only).
#
# On every push to staging, open (or keep) a staging -> main PR when staging
# has commits that main does not have. The PR is promoted with a merge commit
# (GitHub default), which keeps `staging` an ancestor of `main` — so no §8
# reconciliation is needed between cycles. Never push to main directly.
#
# Requires: secret OPENCODE_GITHUB_TOKEN (PAT with repo scope, incl. PR write).
# If the secret is not set, the run exits cleanly with an advisory — it must
# not break staging pushes.

name: sync-main

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0

      - name: Check promotion state
        id: check
        run: |
          # `origin/main` is already fully fetched by checkout (fetch-depth: 0).
          # Do NOT `--depth=1` re-fetch it here: a shallow main truncates its
          # history and `merge-base --is-ancestor ... origin/main` (which walks
          # FROM main) then misses real ancestry, misreporting healthy states
          # as "diverged".
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "ahead=false" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor origin/main HEAD; then
            # True fast-forward possible (staging strictly ahead of main).
            echo "ahead=true" >> "$GITHUB_OUTPUT"
          else
            # Diverged: merge-commit promotion still works (GitHub merges with
            # a merge commit), but log an advisory so drift stays visible.
            echo "::warning::main and staging have diverged (main has commits not on staging) — reconcile (merge main into staging) at the next convenient PR."
            echo "ahead=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or confirm staging -> main PR
        if: steps.check.outputs.ahead == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::OPENCODE_GITHUB_TOKEN is not set; skipping PR sync."
            exit 0
          fi
          # staging already fully promoted: nothing to do. Without this guard
          # `gh pr create` fails with "No commits between main and staging"
          # and the run shows a red X on a healthy repo.
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "staging is already an ancestor of main; nothing to promote."
            exit 0
          fi
          open_prs=$(gh pr list --base main --head staging --state open --json number --jq 'length')
          if [ "${open_prs}" = "0" ]; then
            base=$(git merge-base origin/main HEAD)
            log=$(git log --oneline "${base}..HEAD" | head -20)
            gh pr create --base main --head staging \
              --title "Promote staging -> main" \
              --body "Automatic promotion from \`.github/workflows/sync-main.yml\` (AGENTS.md §8: main is promotion-only).

            Merge this after the NFR-09 gates (lint, tsc, integration tests) pass on staging.

            Commits:

            ${log}"
            echo "Opened staging -> main promotion PR."
          else
            echo "An open staging -> main PR already exists; nothing to do."
          fi
