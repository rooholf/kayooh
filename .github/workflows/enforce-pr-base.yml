# AGENTS.md §8: `main` is promotion-only — it receives `staging` via the
# sync-main promotion PR and nothing else.
#
# Why this exists: the prompt text ("open your PR with base staging — never
# main") proved insufficient. An opencode action run opened its PR with
# `base=main` (`gh pr create` silently defaults to the repository's default
# branch when `--base` is omitted), and the merge landed feature work
# directly on `main`, leaving `staging` without the content (#56, 2026-11-12).
# This check makes the rule mechanical: any PR into `main` whose head branch
# is not `staging` fails its status check. With the check required on `main`,
# such a PR cannot be merged until it is re-pointed at `staging`.

name: enforce-pr-base

on:
  pull_request:
    # `edited` re-runs the check when a PR is re-pointed (base changed), so a
    # fixed PR goes green without a new commit.
    types: [opened, reopened, edited, synchronize, ready_for_review]
    branches: [main]

permissions: {}

jobs:
  block-non-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Only staging may target main
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD" = "staging" ]; then
            echo "§8 OK: staging -> main promotion PR."
            exit 0
          fi
          echo "::error::AGENTS.md §8 violation: only 'staging' may merge into 'main' (promotion-only). This PR's head branch is '$HEAD'."
          echo "Fix: re-point the PR at staging (gh pr edit <number> --base staging), or recreate it with --base staging."
          exit 1
