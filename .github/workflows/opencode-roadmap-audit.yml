# Weekly scheduled audit by the Technical Project Manager persona: scans open
# issues and PRs against the SRS §12 implementation order and produces a status
# report. The report is written to the run summary (Actions tab → run →
# Summary). To also post it as a comment on a pinned tracking issue, create
# the issue and set the repo variable TRACKER_ISSUE_NUMBER to its number.
#
# Model failover: the primary run uses reflection/Beam-1.0-501B-A23B. If it
# fails, an Agnes fallback job retries the same audit on
# agnes/agnes-3.0-flash instead of letting the run fail outright.
#
# Requires: secrets REFLECTION_API_KEY + AGNES_API_KEY.
# Requires: secret OPENCODE_GITHUB_TOKEN (PAT with repo scope).

name: opencode-roadmap-audit

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC (09:00 WIB)
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: staging
          token: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode roadmap audit
        uses: anomalyco/opencode/github@latest
        env:
          REFLECTION_API_KEY: ${{ secrets.REFLECTION_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
        with:
          model: reflection/Beam-1.0-501B-A23B
          agent: tpm
          variant: high
          use_github_token: true
          prompt: |
            You are the Technical Project Manager persona (AGENTS.md #6) running a
            scheduled roadmap audit for the Jambi Bike Rental Platform.

            1. List open issues and PRs (`gh issue list`, `gh pr list`).
            2. Read ISSUE_SKILL_MAP.md (pointer doc: execution rules + where issue state lives) and SRS_Jambi_Bike_Rental_Platform.md §12 to
               place every open item on the 12-step implementation order. Issue state comes from `gh issue list`
               (persona labels + blockers), not from a hand-maintained table.
            3. Produce a status report:
               - progress per Phase 1 step (grounded in issue/PR state, cite numbers),
               - the current critical path and blocked items,
               - stalled issues with a concrete unblocking proposal,
               - unresolved SRS §11.5 TBD decisions that block launch.
            4. Write the full report to the file .github/roadmap-audit-report.md.

            Rules:
            - Every claim must cite an issue number, PR number, or file path.
            - Do NOT run git commit, git push, git checkout or any branch
              operation. Only write the report file — later workflow steps deliver
              it (run summary + tracker issue comment). There is nothing to commit.
            - Do not implement anything; do not open branches or PRs.
            - Do not close or reopen issues; report only.
            - If ISSUE_SKILL_MAP.md is stale versus reality, say exactly what moved.

      - name: Publish report to run summary
        if: always()
        run: |
          if [ -f .github/roadmap-audit-report.md ]; then
            cat .github/roadmap-audit-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — check the OpenCode step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post report to tracking issue
        if: success() && vars.TRACKER_ISSUE_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          TRACKER_ISSUE_NUMBER: ${{ vars.TRACKER_ISSUE_NUMBER }}
        run: |
          gh issue comment "$TRACKER_ISSUE_NUMBER" \
            --body-file .github/roadmap-audit-report.md

  audit-fallback:
    # Bare `.result == 'failure'` never fires: if: conditions without a
    # status-check function get success() auto-prepended. !cancelled() opts
    # in; .result selects failure/cancelled. Verified empirically via fb-test.
    if: ${{ !cancelled() && (needs.audit.result == 'failure' || needs.audit.result == 'cancelled') }}
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Announce fallback
        run: |
          echo "## Fallback run" >> "$GITHUB_STEP_SUMMARY"
          echo "The primary audit run (reflection/Beam-1.0-501B-A23B) failed. Retrying" >> "$GITHUB_STEP_SUMMARY"
          echo "on the Agnes fallback model (agnes/agnes-3.0-flash)." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: staging
          token: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode roadmap audit (Agnes fallback)
        uses: anomalyco/opencode/github@latest
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
        with:
          model: agnes/agnes-3.0-flash
          agent: tpm
          use_github_token: true
          prompt: |
            You are the Technical Project Manager persona (AGENTS.md #6) running a
            scheduled roadmap audit for the Jambi Bike Rental Platform.

            1. List open issues and PRs (`gh issue list`, `gh pr list`).
            2. Read ISSUE_SKILL_MAP.md (pointer doc: execution rules + where issue state lives) and SRS_Jambi_Bike_Rental_Platform.md §12 to
               place every open item on the 12-step implementation order. Issue state comes from `gh issue list`
               (persona labels + blockers), not from a hand-maintained table.
            3. Produce a status report:
               - progress per Phase 1 step (grounded in issue/PR state, cite numbers),
               - the current critical path and blocked items,
               - stalled issues with a concrete unblocking proposal,
               - unresolved SRS §11.5 TBD decisions that block launch.
            4. Write the full report to the file .github/roadmap-audit-report.md.

            Rules:
            - Every claim must cite an issue number, PR number, or file path.
            - Do NOT run git commit, git push, git checkout or any branch
              operation. Only write the report file — later workflow steps deliver
              it (run summary + tracker issue comment). There is nothing to commit.
            - Do not implement anything; do not open branches or PRs.
            - Do not close or reopen issues; report only.
            - If ISSUE_SKILL_MAP.md is stale versus reality, say exactly what moved.

      - name: Publish report to run summary
        if: always()
        run: |
          if [ -f .github/roadmap-audit-report.md ]; then
            cat .github/roadmap-audit-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — check the OpenCode step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post report to tracking issue
        if: success() && vars.TRACKER_ISSUE_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          TRACKER_ISSUE_NUMBER: ${{ vars.TRACKER_ISSUE_NUMBER }}
        run: |
          gh issue comment "$TRACKER_ISSUE_NUMBER" \
            --body-file .github/roadmap-audit-report.md
