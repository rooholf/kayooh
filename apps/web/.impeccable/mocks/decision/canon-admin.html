<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Canon Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; background: #FFFFFF; color: #111827; font-family: "Inter", system-ui, sans-serif; display: grid; grid-template-columns: 220px 1fr; }
  .rail { background: #F9FAFB; border-right: 1px solid #E5E7EB; padding: 20px 12px; }
  .rail .item { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 4px; }
  .rail .item.active { background: #2563EB; color: #fff; }
  .main { padding: 24px; }
  .kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
  .kpi { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 16px; }
  .kpi .n { font-size: 28px; font-weight: 800; }
  .kpi .l { font-size: 11px; color: #6B7280; text-transform: uppercase; letter-spacing: .1em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px; border-bottom: 1px solid #E5E7EB; color: #6B7280; font-size: 11px; text-transform: uppercase; }
  td { padding: 8px; border-bottom: 1px solid #F3F4F6; }
</style>
</head>
<body>
  <div class="rail">
    <div style="font-weight:800;margin-bottom:16px;">Kayooh Admin</div>
    <div class="item active">Dashboard</div>
    <div class="item">Outlet</div>
    <div class="item">Sepeda</div>
    <div class="item">Owner</div>
    <div class="item">Staff</div>
    <div class="item">Keuangan</div>
    <div class="item">Konfigurasi</div>
  </div>
  <div class="main">
    <h1 style="font-size:20px;font-weight:800;margin-bottom:16px;">Dashboard</h1>
    <div class="kpis">
      <div class="kpi"><div class="n">150</div><div class="l">Sepeda</div></div>
      <div class="kpi"><div class="n">4</div><div class="l">Outlet</div></div>
      <div class="kpi"><div class="n">3</div><div class="l">Verifikasi</div></div>
      <div class="kpi"><div class="n">1</div><div class="l">Sengketa</div></div>
    </div>
    <table>
      <thead><tr><th>Outlet</th><th>Owner</th><th>Tersedia</th><th>Disewa</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Outlet 01</td><td>Owner A</td><td>12</td><td>3</td><td>Aktif</td></tr>
        <tr><td>Outlet 02</td><td>Owner B</td><td>7</td><td>2</td><td>Aktif</td></tr>
        <tr><td>Outlet 03</td><td>Owner C</td><td>2</td><td>4</td><td>Aktif</td></tr>
        <tr><td>Outlet 04</td><td>Owner D</td><td>9</td><td>1</td><td>Aktif</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
