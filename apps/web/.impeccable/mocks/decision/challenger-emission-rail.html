<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>Kayooh — Rel ketersediaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--arang:#131518;--tulang:#E7E5DF;--abu:#8A8E96;
  --nm405:#8A4FD6;--nm436:#3E6FF0;--nm486:#16BFC4;--nm546:#5BC93A;--nm589:#FFC400;--nm615:#FF7A1A;--nm656:#FF3B30}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:var(--arang);color:var(--tulang);font-family:'Schibsted Grotesk',sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.panggung{position:absolute;inset:0;overflow:hidden;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 4px),
  radial-gradient(140% 70% at 50% 42%,#1D2025 0%,var(--arang) 72%)}
.panggung::before{content:"";position:absolute;inset:11px;border:1px solid rgba(231,229,223,.16)}

.lab{position:absolute;left:0;right:0;font-size:8px;letter-spacing:.24em;color:var(--abu);
  text-transform:uppercase}

.kepala{position:absolute;left:26px;right:26px;top:26px;display:flex;align-items:baseline;
  justify-content:space-between}
.kepala b{font-weight:500;font-size:16px;letter-spacing:.34em}
.kepala span{font-size:8px;letter-spacing:.2em;color:var(--abu)}

.kendali{position:absolute;left:26px;right:26px;top:74px}
.warna{display:flex;gap:6px;margin-top:9px}
.warna button{flex:1;background:none;border:0;padding:0;text-align:left;color:var(--tulang);
  font-family:inherit;cursor:pointer}
.warna i{display:block;height:1px;background:currentColor;opacity:.42}
.warna b{display:block;font-weight:400;font-size:8px;letter-spacing:.14em;color:var(--abu);
  margin-top:7px;text-transform:uppercase}
.warna u{display:block;text-decoration:none;font-weight:500;font-size:14px;margin-top:3px}
.warna .on i{height:2px;opacity:1;box-shadow:0 0 10px currentColor}
.warna .on b{color:var(--tulang)}
.warna .c486{color:var(--nm486)}.warna .c546{color:var(--nm546)}
.warna .c615{color:var(--nm615)}.warna .c656{color:var(--nm656)}
.zaman{display:flex;gap:16px;margin-top:15px}
.zaman span{font-size:8.5px;letter-spacing:.2em;color:var(--abu);border-top:1px solid transparent;
  padding-top:5px}
.zaman .on{color:var(--nm589);border-top-color:var(--nm589);font-weight:700}

.plat{position:absolute;left:26px;right:26px;top:200px;border:1px solid rgba(231,229,223,.3);
  padding:14px 14px 12px}
.plat .judul{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid rgba(231,229,223,.22);padding-bottom:9px}
.plat .judul b{font-weight:500;font-size:15px;letter-spacing:.06em}
.plat .judul i{font-style:normal;font-size:8px;letter-spacing:.28em;color:var(--abu)}
.rada{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:10.5px;letter-spacing:.12em}
.rada+.rada{border-top:1px solid rgba(231,229,223,.09)}
.rada .c{width:22px;height:1px;flex:none}
.rada .nm{flex:1;color:var(--abu);text-transform:uppercase;font-size:9px}
.rada b{font-weight:500;font-size:15px}
.rada.mati .nm,.rada.mati b{color:#5C6067}
.rada.mati .c{background:repeating-linear-gradient(90deg,#5C6067 0 4px,transparent 4px 9px)!important}
.plat .catatan{font-size:8.5px;line-height:1.5;color:var(--abu);letter-spacing:.06em;
  margin-top:9px;border-top:1px solid rgba(231,229,223,.12);padding-top:8px}

.kontinum{position:absolute;left:26px;right:26px;top:470px;height:140px;
  background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0) 40%,rgba(0,0,0,.22))}
.kontinum i{position:absolute;height:1px;opacity:.85}

.rel{position:absolute;left:26px;right:26px;top:646px;height:1px;background:rgba(231,229,223,.5)}
.stub{position:absolute;width:1px;bottom:197px}
.stub.solid{background:rgba(231,229,223,.85)}
.stub.putus{background:repeating-linear-gradient(180deg,rgba(231,229,223,.85) 0 5px,transparent 5px 10px)}
.stub.buka{width:2px;background:var(--nm589);box-shadow:0 0 9px rgba(255,196,0,.75)}
.kode{position:absolute;top:658px;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;
  color:var(--abu)}
.kode.on{color:var(--nm589);font-weight:700}

.aksi{position:absolute;left:26px;right:26px;bottom:26px;height:64px;display:flex;
  align-items:center;gap:14px;padding:0 16px;background:rgba(231,229,223,.05);
  border:1px solid rgba(231,229,223,.42);box-shadow:inset 3px 0 0 var(--tulang)}
.aksi .t{flex:1;text-align:left}
.aksi .t i{display:block;font-style:normal;font-size:8px;letter-spacing:.26em;color:var(--abu)}
.aksi .t b{display:block;font-weight:500;font-size:15px;letter-spacing:.1em;margin-top:6px}
.aksi .p{font-size:17px;color:var(--nm589)}
</style>
</head>
<body>
<div class="panggung">

  <div class="kepala"><b>KAYOOH</b><span>JAMBI &middot; 05/11 &middot; WIB</span></div>

  <div class="kendali">
    <p class="lab">Panjang gelombang &middot; jenis sepeda</p>
    <div class="warna">
      <button class="on c486"><i></i><b>Commuter</b><u>4</u></button>
      <button class="c546"><i></i><b>Road</b><u>1</u></button>
      <button class="c615"><i></i><b>MTB</b><u>3</u></button>
      <button class="c656"><i></i><b>Fixie</b><u>0</u></button>
    </div>
    <div class="zaman">
      <span>PAGI</span><span class="on">SIANG</span><span>SORE</span><span>MALAM</span>
    </div>
  </div>

  <div class="plat">
    <div class="judul"><b>TELANAIPURA</b><i>TLP &middot; COMMUTER &middot; SIANG</i></div>
    <div class="rada"><i class="c" style="background:var(--nm486)"></i><span class="nm">Commuter</span><b>4</b></div>
    <div class="rada"><i class="c" style="background:var(--nm546)"></i><span class="nm">Road</span><b>1</b></div>
    <div class="rada"><i class="c" style="background:var(--nm615)"></i><span class="nm">MTB</span><b>3</b></div>
    <div class="rada mati"><i class="c"></i><span class="nm">Fixie</span><b>0</b></div>
    <p class="catatan">Angka dikirim server saat kamu membuka layar ini. Tidak ada salinan di ponsel, tidak ada taksiran.</p>
  </div>

  <div class="kontinum">
    <i style="top:12px;left:0;right:64%;background:var(--nm405)"></i>
    <i style="top:34px;left:8%;right:38%;background:var(--nm436)"></i>
    <i style="top:56px;left:0;right:12%;background:var(--nm486)"></i>
    <i style="top:78px;left:22%;right:54%;background:var(--nm546)"></i>
    <i style="top:100px;left:4%;right:30%;background:var(--nm589)"></i>
    <i style="top:118px;left:34%;right:0;background:var(--nm615)"></i>
    <i style="top:130px;left:0;right:70%;background:var(--nm656)"></i>
  </div>

  <div class="rel"></div>
  <div class="stub buka" style="left:44px;top:438px"></div>
  <div class="stub solid" style="left:132px;height:38px"></div>
  <div class="stub putus" style="left:206px;height:26px"></div>
  <div class="stub solid" style="left:280px;height:46px"></div>
  <div class="stub solid" style="left:354px;height:14px"></div>
  <div class="kode on" style="left:44px">TLP</div>
  <div class="kode" style="left:132px">KTB</div>
  <div class="kode" style="left:206px">JLT</div>
  <div class="kode" style="left:280px">PLM</div>
  <div class="kode" style="left:354px">SPN</div>

  <button class="aksi">
    <span class="t"><i>LINE NYALA = ADA UNIT HARI INI</i><b>LANJUT PESAN</b></span>
    <span class="p">&#9656;</span>
  </button>

</div>
</body>
</html>
