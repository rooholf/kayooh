<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Buku Besar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { background: #F1ECE0; color: #1B1B18; font-family: "Inter", system-ui, sans-serif; display: grid; grid-template-rows: 56px 1fr; }
  .head { border-bottom: 2px solid #1B1B18; padding: 0 24px; display: flex; align-items: center; gap: 16px; }
  .head .title { font-family: "Roboto Mono", monospace; font-weight: 700; }
  .sheet { padding: 24px; display: grid; grid-template-columns: 260px 1fr; gap: 24px; }
  .ledger { background: #FBF7EE; border: 2px solid #1B1B18; padding: 16px; font-family: "Roboto Mono", monospace; font-size: 12px; }
  .ledger h3 { font-family: "Inter", sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 8px; }
  .ledger .row { display: grid; grid-template-columns: 90px 1fr 80px; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgba(27,27,24,.15); }
  .ledger .row.tot { font-weight: 700; border-top: 2px solid #1B1B18; border-bottom: none; margin-top: 6px; }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .card { background: #FBF7EE; border: 2px solid #1B1B18; padding: 16px; }
  .card h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 6px; }
  .big { font-family: "Roboto Mono", monospace; font-size: 40px; font-weight: 800; }
</style>
</head>
<body>
  <div class="head">
    <div class="title">KAYOOH · ADMIN · BUKU BESAR</div>
    <div style="margin-left:auto;font-size:12px;">Minggu 02 Nov 2026 · WIB</div>
  </div>
  <div class="sheet">
    <div class="ledger">
      <h3>Saldo outlet</h3>
      <div class="row"><span>01 Comm</span><span>Booking</span><span>+12</span></div>
      <div class="row"><span>02 Road</span><span>Booking</span><span>+7</span></div>
      <div class="row"><span>03 MTB</span><span>Kembali</span><span>-3</span></div>
      <div class="row"><span>04 Fixie</span><span>Refund</span><span>-1</span></div>
      <div class="row tot"><span>TOTAL</span><span>sepeda</span><span>150</span></div>
    </div>
    <div class="side">
      <div class="card"><h4>Settlement minggu ini</h4><div class="big">Rp 2.160.000</div><div style="font-size:12px;opacity:.7;">4 owner · payout Selasa</div></div>
      <div class="card"><h4>Verifikasi ID tertunda</h4><div class="big">3</div><div style="font-size:12px;opacity:.7;">review manual</div></div>
      <div class="card"><h4>Sengketa terbuka</h4><div class="big">1</div><div style="font-size:12px;opacity:.7;">window 7 hari</div></div>
    </div>
  </div>
</body>
</html>
